# Handy dictation bindings. This file is linked into ~/.config/hypr by dotfiles/handy.

# Reuse Omarchy's dictation bindings, replacing its optional Voxtype commands.
unbind = SUPER CTRL, X
bindd = SUPER CTRL, X, Toggle Handy dictation, exec, $HOME/.nix-profile/bin/handy --toggle-transcription

unbind = , F9
bindd = , F9, Start Handy dictation (push-to-talk), exec, $HOME/.nix-profile/bin/handy --toggle-transcription
binddr = , F9, Stop Handy dictation (push-to-talk), exec, $HOME/.nix-profile/bin/handy --toggle-transcription
