# Managed by dotfiles/arch/noctalia
# Keep Vicinae on Super+Space; these only expose Noctalia's trial surfaces.
# Crossing-yellow to train-coral focus ring; deep blue when unfocused.
general {
  col.active_border = rgb(f4c430) rgb(d77561) 45deg
  col.inactive_border = rgb(0f3857)
}

exec-once = noctalia --daemon
bind = SUPER, N, exec, noctalia msg panel-toggle control-center
# Super+Shift is the dedicated layer for Noctalia surfaces.
bind = SUPER SHIFT, W, exec, noctalia msg panel-toggle luanv/network:panel
bind = SUPER SHIFT, N, exec, noctalia msg panel-toggle launcher
