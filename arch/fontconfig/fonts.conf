<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Berkeley Mono is the desktop's deliberate technical voice. -->
  <alias>
    <family>monospace</family>
    <prefer><family>Berkeley Mono</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Berkeley Mono</family></prefer>
  </alias>
</fontconfig>
