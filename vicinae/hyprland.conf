# Vicinae bindings. This file is linked into ~/.config/hypr by dotfiles/vicinae.
# Keep core desktop bindings in hyprland.conf; put only Vicinae-specific actions here.

# Replace Omarchy's default Walker binding during the Vicinae trial.
unbind = SUPER, SPACE
bindd = SUPER, SPACE, Vicinae launcher, exec, $HOME/.nix-profile/bin/vicinae toggle
bindd = SUPER, B, Google Chrome, exec, $HOME/.nix-profile/bin/google-chrome
bindd = SUPER, M, iCloud Mail, exec, $HOME/.nix-profile/bin/google-chrome --app=https://www.icloud.com/mail/
unbind = SUPER, V
bindd = SUPER, Z, Clipboard history, exec, $HOME/.nix-profile/bin/vicinae 'vicinae://launch/clipboard/history?toggle=true'

